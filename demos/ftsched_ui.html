<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>flaschen taschen — console</title>

<!-- The operator's console. The remote at / is the surface for everybody else:
     what is on the wall, a mode, brightness. Everything that needs the whole
     rotation in front of it -- per-effect enable, the generated settings
     forms, the running order, render cost and frame-rate health -- is here,
     and the two link to each other.

     One hand-written file, no framework, no build step, read off disk per
     request so it can be edited against a running daemon. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: the shop wifi reaches the wall long before it reaches
     Google, and the page is laid out to be correct in the system font. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* The wall is 320x64, so every preview here is 5:1 and never scaled past its
   native width -- a blown-up LED panel looks like a mistake rather than like
   pixel art. Same warm palette as the remote at /: tapping through should not
   feel like arriving somewhere else. */
:root {
  --bg: #12110e;
  --card: #1b1a15;
  --card-hi: #232219;
  --line: #33312a;
  --rule: #26251e;
  --text: #eae6da;
  --dim: #8f887a;
  --faint: #726b5b;
  --on: #6cbf5f;
  --build: #c08a5a;
  --wait: #c9a24b;
  --bad: #d98a86;
  --off: #403c33;
  --pad: 16px;
  --sans: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
/* Cues: what plays at a time of day rather than in the running order. A chip
   each, the times it is wanted at, and a way to see it before 9:25 -- which
   is the whole reason the button is there, since otherwise the only way to
   check a cue is to be standing here at 9:25. */
.cuelist { display: flex; flex-wrap: wrap; gap: 8px; }
.cue { display: flex; align-items: center; gap: 8px; padding: 4px 8px;
       border: 1px solid var(--line); border-radius: 999px; }
.cue .at { opacity: 0.7; font-variant-numeric: tabular-nums; }
.cue .at .done { text-decoration: line-through; }
.cue[data-playing="true"] { border-color: var(--live); }
/* The UA rule for [hidden] is display:none at the lowest specificity, so any
   class that sets display silently beats it and the element stays on screen. */
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.4 var(--sans);
  -webkit-text-size-adjust: 100%;
  padding: 0 var(--pad) calc(28px + env(safe-area-inset-bottom));
}
.wrap { max-width: 1040px; margin: 0 auto; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.gap { flex: 1 1 0; min-width: 0; }

button {
  font: inherit; font-family: var(--sans); font-weight: 600;
  color: var(--text); background: var(--card-hi); cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 13px; min-height: 38px;      /* thumb-sized on a phone */
  -webkit-tap-highlight-color: transparent;
}
button:hover { background: #2b291f; }
button:active { transform: translateY(1px); }
a { color: var(--dim); }

/* ---- header ------------------------------------------------------------ */
header {
  position: sticky; top: 0; z-index: 10;
  margin: 0 calc(-1 * var(--pad)); padding: 14px var(--pad) 10px;
  background: linear-gradient(var(--bg) 82%, transparent);
  backdrop-filter: blur(6px);
}
.bar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin: 0; }
.back { font-family: var(--mono); font-size: 12px; text-decoration: underline;
        text-underline-offset: 3px; }
.back:hover { color: var(--text); }
#health { font-family: var(--mono); font-size: 12px; color: var(--faint); }
#health.warn { color: var(--build); }

/* The now block: the wall across the top, and who/what/transport on the line
   underneath it.

   This used to be a single row shaped like a rotation row, matching them so the
   eye read the two as the same kind of thing. That was right while the tile
   held a baked clip -- a 110px strip is plenty to confirm which demo is up. It
   is the wrong shape for a live view, which is not an identifying thumbnail but
   the thing you actually came to look at, and at 110px you cannot read a wall
   320 pixels wide. So it gets the full width of the card and the rest moves
   down a row. */
.now {
  display: flex; align-items: center; gap: 12px; margin-top: 10px;
  padding: 10px 12px; background: var(--card); border: 1px solid var(--line);
  border-radius: 11px; flex-wrap: wrap; position: relative;
}
/* Its own row, the whole width. The 5:1 aspect-ratio on .thumb does the rest:
   inside a 1040px wrap that lands about 200px tall, a bit over 3x the wall's
   320 -- and object-fit: contain with image-rendering: pixelated means the
   upscale stays square-edged instead of turning into soup. */
.now .thumb { flex: 1 0 100%; width: auto; }
/* The "no preview" text sits on a tile many times the size it was written for. */
.now .thumb .missing { font-size: 12px; }

/* Make it look like the thing it is: 320x64 discrete emitters on a black
   board, not a smooth picture of one.

   The mask punches one round aperture per LED. mask-size is the tile divided by
   the panel's own dimensions, so the apertures stay registered to the pixels at
   any card width -- there is no fixed pitch to drift out of alignment. Between
   them the board shows through, which is what gives the dot texture.

   The aperture is soft-edged rather than a hard circle. A real LED is brightest
   at the middle and falls off into its diffuser, and the gradient is both a
   better likeness and much kinder to the sampler: at a hair over 3 screen
   pixels per LED a hard circle aliases into a moire, and a soft one does not.

   Brightness is pushed back up because the mask throws away well over half the
   light, and an unlit gap reads as darker still next to a bright neighbour. */
.now .thumb img {
  --led-cols: 320;
  --led-rows: 64;
  -webkit-mask-image: radial-gradient(circle,
    rgba(0,0,0,1) 0 30%, rgba(0,0,0,.65) 46%, rgba(0,0,0,0) 62%);
  mask-image: radial-gradient(circle,
    rgba(0,0,0,1) 0 30%, rgba(0,0,0,.65) 46%, rgba(0,0,0,0) 62%);
  -webkit-mask-size: calc(100% / var(--led-cols)) calc(100% / var(--led-rows));
  mask-size: calc(100% / var(--led-cols)) calc(100% / var(--led-rows));
  filter: brightness(1.45) saturate(1.12);
}
/* The board behind the emitters. Not pure black -- a dark panel in a lit room
   is never quite black, and a little lift makes the unlit LEDs read as objects
   sitting there rather than as holes in the card. */
.now .thumb { background: #090909; }
/* The two things that make it read as hardware rather than as a texture.

   The seams: betelgeuse is not one 320x64 panel, it is five 64x64 panels in a
   chain, and on the real wall you can see where they butt together. Every 20%
   is exactly that join.

   The vignette: a panel is a physical object under a light, so the middle is
   brighter than the corners. Both are far too faint to read as decoration and
   that is the point -- they are the difference between a picture of a wall and
   a wall. */
.now .thumb::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(90deg,
      rgba(255,255,255,.05) 0 1px, transparent 1px 20%),
    radial-gradient(120% 150% at 50% 45%,
      transparent 45%, rgba(0,0,0,.35) 100%);
}
.now .who { flex: 1; min-width: 0; }
.now .title { font-size: 17px; font-weight: 700; }
.now .title .pos { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--dim); }
.now .up { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.now .up b { color: var(--text); font-weight: 600; }
.now .up .building { color: var(--build); }
#progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 6px; }
#progress i { display: block; height: 100%; width: 0; background: var(--on); transition: width .25s linear; }
.now .transport { display: flex; gap: 6px; flex: none; }
#btnPause[aria-pressed="true"] { border-color: var(--wait); color: var(--wait); }
.now .title, .now .up { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 560px) {
  /* Pause and Skip drop under the line rather than squeezing the name into a
     column three characters wide. The wall keeps the full width it has at every
     other size -- on a phone held upright that is the only way it is legible at
     all, and it is still only a fifth as tall as it is wide. */
  .now .who { flex: 1 1 140px; }
  .now .transport { flex: 1 0 100%; }
  /* A phone gives each LED barely one screen pixel, which is not enough to put
     a hole in the middle of: the apertures land between samples and the picture
     turns to moire. The wall renders flat down here, and legibility is worth
     more than the texture. */
  .now .thumb img {
    -webkit-mask-image: none; mask-image: none;
    filter: none;
  }
  .now .transport button { flex: 1; }
}

/* ---- toolbar ----------------------------------------------------------- */
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 12px; }
#search {
  flex: 1 1 220px; min-width: 160px; font: inherit; font-family: var(--mono);
  /* 16px, or iOS Safari zooms the page the instant the field takes focus. */
  font-size: 16px;
  background: #171610; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 13px; color: var(--text);
}
#search:focus-visible { outline: 2px solid var(--on); outline-offset: 1px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--dim); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--on); color: #0f1a0d; }
#count { font-family: var(--mono); font-size: 12px; color: var(--dim); }

/* ---- the index: seven headings, not one wall of 86 --------------------- */
.sections { border-top: 1px solid var(--rule); }
.sec { border-bottom: 1px solid var(--rule); }
.sec > .head {
  display: flex; align-items: center; gap: 12px; padding: 13px 2px; width: 100%;
  background: none; border: 0; border-radius: 0; text-align: left; min-height: 0;
}
.sec > .head:hover { background: none; }
.sec .caret { font-family: var(--mono); font-size: 13px; color: var(--dim); width: 14px; flex: none; }
.sec .label { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.sec .desc { font-size: 13px; font-weight: 400; color: var(--dim); flex: 1; min-width: 0; text-wrap: pretty; }
.sec .tally { font-family: var(--mono); font-size: 12px; color: var(--faint); flex: none; }
.sec .tally.part { color: var(--build); }
.sec .tally.full { color: var(--on); }
.sec .setmode { flex: none; padding: 6px 11px; min-height: 32px; font-size: 12px; background: var(--card); }
.sec .setmode[aria-checked="true"] { border-color: var(--on); color: var(--on); }
.sec .body { padding: 0 0 10px 26px; }
@media (max-width: 640px) {
  .sec .desc { display: none; }             /* the heading carries it on a phone */
  .sec .body { padding-left: 0; }
}
@media (max-width: 430px) {
  .row .thumb { width: 72px; }
  .row .meta .len { display: none; }
}

/* ---- a rotation row ---------------------------------------------------- */
.row { display: flex; align-items: center; gap: 11px; padding: 7px 6px; border-radius: 8px; }
.row.live { background: #1e2418; }
.row.pending { background: #221f16; }
.row.disabled .thumb, .row.disabled .name { opacity: .38; }
.thumb {
  flex: none; width: 84px; aspect-ratio: 5 / 1; padding: 0; min-height: 0;
  background: #000; border: 1px solid var(--line); border-radius: 5px; overflow: hidden;
  position: relative;
}
.thumb img { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
.thumb .missing {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--mono); font-size: 7px; letter-spacing: .1em; color: var(--faint);
}
.row .who { flex: 1; min-width: 0; }
/* One line each, whatever the name is and however many chips it has: a row
   that grows to three lines on a phone turns the list into a scroll of ragged
   blocks and loses the shape of the running order. */
.row .name, .row .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .name { font-weight: 600; font-size: 15px; }
.row .meta { font-family: var(--mono); font-size: 10px; color: var(--dim); }
.row .meta .ms.warm { color: var(--build); }
.row .meta .ms.hot { color: var(--bad); }
.chip {
  font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: .06em;
  padding: 1px 7px; border-radius: 8px; margin-left: 6px; white-space: nowrap;
}
.chip.cust { color: var(--build); border: 1px solid #43331f; }
.chip.solo { color: var(--dim); border: 1px solid var(--line); }
/* The acknowledgement, on the row that was tapped, from the moment it was
   tapped: requested -> queued -> building -> on air. See the note in the
   script -- none of these claim more than the API actually said. */
.chip.st { color: #12110e; background: var(--wait); }
.chip.st.building { background: var(--build); }
.chip.st.onair { background: var(--on); }
.cog { flex: none; width: 30px; min-height: 30px; padding: 0; color: var(--dim); font-size: 14px; }
.cog:hover { color: var(--text); }
.cog.custom { color: var(--build); border-color: #43331f; }

/* A checkbox styled as a switch, so it stays a real control: focusable,
   toggleable from the keyboard, announced properly by a screen reader. */
.sw { flex: none; position: relative; width: 44px; height: 26px; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.sw span { position: absolute; inset: 0; border-radius: 999px; background: var(--off);
           transition: background .15s; pointer-events: none; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                  border-radius: 50%; background: var(--text); transition: transform .12s; }
.sw input:checked + span { background: var(--on); }
.sw input:checked + span::after { transform: translateX(18px); }
.sw input:focus-visible + span { outline: 2px solid var(--text); outline-offset: 2px; }

/* ---- the running order ------------------------------------------------- */
#order { border-top: 1px solid var(--rule); }
#order .row { border-bottom: 1px solid #201f19; border-radius: 0; padding: 8px 4px; gap: 13px; }
#order .num { font-family: var(--mono); font-size: 13px; color: var(--dim); width: 32px;
              text-align: right; flex: none; }
#order .thumb { width: 96px; }
#order .cost { font-family: var(--mono); font-size: 11px; width: 54px; text-align: right; flex: none; color: var(--dim); }
#order .cost.warm { color: var(--build); }
#order .cost.hot { color: var(--bad); }
#order .slot { font-family: var(--mono); font-size: 11px; color: var(--dim); width: 108px;
               text-align: right; flex: none; }
@media (max-width: 640px) { #order .slot { display: none; } }

#empty { color: var(--dim); padding: 26px 4px; }

/* ---- the bottom of the page: the display, and the sharp edges ---------- */
/* Kept away from everything routine and behind a confirmation each. There is
   no authentication here by design -- it is a wall in a workshop -- so the
   only thing standing between a mis-tap and a dark wall is where the button
   sits and what it asks. */
.zone {
  margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--rule);
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.zone .tag { font-family: var(--mono); font-size: 11px; color: var(--faint);
             letter-spacing: .1em; text-transform: uppercase; }
.zone.display input[type=range] { flex: 1 1 130px; min-width: 100px; accent-color: var(--on); }
.zone.display output { font-family: var(--mono); font-size: 12px; color: var(--dim); min-width: 3.4em; text-align: right; }
.zone.display label { font-size: 13px; color: var(--dim); }
.zone.display.nodimmer label, .zone.display.nodimmer input, .zone.display.nodimmer output {
  opacity: .4; pointer-events: none;
}
.danger { border-color: #4a2e2c; background: #1c1310; color: var(--bad); }
.danger:hover { background: #241713; }
#btnPower[aria-pressed="true"] { border-color: var(--bad); color: var(--bad); }

/* ---- the settings editor ----------------------------------------------- */
/* <dialog> rather than a hand-rolled overlay: it comes with the backdrop, the
   focus trap, Esc, and inertness of everything behind it. A sheet up from the
   bottom on a phone, where a thumb is; a centred panel on a desktop. */
dialog {
  border: 1px solid var(--line); border-radius: 16px; padding: 0;
  background: var(--card); color: var(--text); overflow: hidden;
  width: min(560px, calc(100% - 24px)); max-height: min(88vh, 780px);
}
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(8, 7, 5, .68); }
#editorForm { display: flex; flex-direction: column; min-height: 0; }
.ed-head, .ed-foot { display: flex; align-items: center; gap: 10px; flex: none; padding: 13px 15px; }
.ed-head { border-bottom: 1px solid var(--line); }
.ed-foot { border-top: 1px solid var(--line); }
.ed-head b { font-size: 19px; font-weight: 800; }
.ed-head .mod { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.ed-x { width: 32px; min-height: 32px; padding: 0; color: var(--dim); }
.ed-body { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; padding: 2px 15px 15px; }
.ed-note { color: var(--dim); font-size: 12px; padding-top: 12px; text-wrap: pretty; }
.ed-empty { padding: 20px; text-align: center; color: var(--dim);
            background: #171610; border: 1px dashed var(--line); border-radius: 10px; margin-top: 12px; }
.save { background: var(--on); color: #0f1a0d; border-color: var(--on); font-weight: 700; }
.save:hover { background: #7ccd6f; }

.fld { padding: 11px 0; border-bottom: 1px solid var(--rule); }
.fld .top { display: flex; align-items: center; gap: 12px; }
.fld .lbl { font-weight: 600; }
.fld .lbl em { font-family: var(--mono); color: var(--faint); font-weight: 400; font-style: normal; font-size: 11px; }
.fld .ctl { margin-left: auto; flex: none; }
.fld .hlp { color: var(--dim); font-size: 12px; margin-top: 5px; text-wrap: pretty; }
.fld > .ctl { margin: 8px 0 0; width: 100%; }
.fld input[type=text], .fld input[type=number], .fld select, .fld textarea {
  font: inherit; font-family: var(--mono); font-size: 16px;
  color: var(--text); background: #171610; width: 100%;
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px;
}
.fld input[type=number] { width: 9ch; text-align: right; }
.fld select { width: auto; max-width: 15rem; }
.fld textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
.fld input:focus-visible, .fld select:focus-visible, .fld textarea:focus-visible {
  outline: 2px solid var(--on); outline-offset: 1px; border-color: var(--on);
}
@media (max-width: 520px) {
  dialog { width: 100%; max-width: 100%; max-height: 92vh; margin: auto auto 0;
           border-radius: 16px 16px 0 0; border-bottom: 0; }
  .ed-foot { padding-bottom: calc(13px + env(safe-area-inset-bottom)); }
  .fld input[type=number] { width: 8ch; }
}

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 50;
  max-width: calc(100% - 32px);
  background: var(--card-hi); border: 1px solid var(--on); color: var(--text);
  font-family: var(--mono); font-size: 13px; padding: 9px 16px; border-radius: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,.5); display: none;
}
#toast.bad { border-color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="bar">
    <h1>Console</h1>
    <!-- Only meaningful when nginx is fronting this; served standalone on
         :8081 the root is this same page, which is harmless. -->
    <a class="back" href="/">&larr; Remote</a>
    <span class="gap"></span>
    <span id="health"></span>
  </div>

  <div class="now">
    <span class="thumb" id="nowThumb"><img id="nowImg" alt="" hidden><span class="missing" id="nowMissing">no preview</span></span>
    <div class="who">
      <div class="title"><span id="nowName">—</span> <span class="pos" id="nowPos"></span></div>
      <div class="up">next · <b id="nextName">—</b><span class="building" id="nextBuilding" hidden> · building</span></div>
      <div id="progress"><i></i></div>
    </div>
    <div class="transport">
      <button id="btnPause" aria-pressed="false">Pause</button>
      <button id="btnNext">Skip</button>
    </div>
  </div>
</header>

<div class="tools">
  <input type="search" id="search" placeholder="Search the rotation…" aria-label="Search the rotation" autocomplete="off">
  <div class="seg" role="group" aria-label="View">
    <button id="viewIndex" aria-pressed="true">Index</button>
    <button id="viewOrder" aria-pressed="false">Order</button>
  </div>
  <span id="count"></span>
  <span class="gap"></span>
  <button id="btnAllOn">Enable all</button>
</div>

<!-- Grouped by theme, from rotation-groups.json by way of /api/schema. The
     groups were always meaningful; until now they were only a bulk switch and
     not a way to look through 86 things. -->
<div class="sections" id="sections"></div>
<!-- The same entries as the running order actually plays them, which is the
     other question an operator asks and the grouping cannot answer. -->
<div id="order" hidden></div>
<div id="empty" hidden>Nothing matches that.</div>

<!-- Only drawn when this wall has a cue file. A zone that is always there
     and usually empty teaches people to ignore that part of the page. -->
<div class="zone cues" id="cuesZone" hidden>
  <span class="tag">At a time of day</span>
  <div id="cues" class="cuelist"></div>
</div>

<div class="zone display" id="displayZone" hidden>
  <span class="tag">Display</span>
  <button id="btnPower" aria-pressed="false">Wall off</button>
  <label for="dim">Brightness</label>
  <input type="range" id="dim" min="1" max="100" step="1" value="100" aria-label="Display brightness">
  <output id="dimOut">100%</output>
</div>

<div class="zone">
  <span class="tag">Destructive &middot; each one asks first</span>
  <button class="danger" id="btnAllOff">Disable all</button>
  <button class="danger" id="btnWipe">Wipe every layer</button>
</div>

</div><!-- /wrap -->

<dialog id="editor" aria-labelledby="edName">
  <!-- method="dialog" so Enter in a field closes rather than navigates; every
       button carries an explicit type, since a bare one inside a form submits
       and would dismiss the editor on the way past. -->
  <form id="editorForm" method="dialog">
    <div class="ed-head">
      <b id="edName">—</b>
      <span class="mod" id="edModule"></span>
      <span class="gap"></span>
      <button type="button" class="ed-x" id="edClose" aria-label="Close">&#10005;</button>
    </div>
    <div class="ed-body" id="edBody"></div>
    <div class="ed-foot">
      <button type="button" id="edReset">Restore shipped</button>
      <span class="gap"></span>
      <button type="button" id="edCancel">Cancel</button>
      <button type="button" class="save" id="edSave">Save</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const sections = $("sections");
const orderBox = $("order");

let state = null;
let rows = new Map();             // name -> {row, img, missing, box, meta, cog, chips}
let orderRows = new Map();        // name -> the same, in the Order view
// module -> [option specs], read once with the groups. Empty until
// /api/schema answers, which is what decides whether a row gets a settings
// button at all, so the rows are rebuilt when it lands.
let schema = {};
let groups = [];                  // [{key, label, description, count, members}]
let view = "index";
let query = "";
let open = {};                    // group key -> expanded
// The server publishes once a second; the slot bar is advanced locally in
// between so it moves smoothly instead of stepping.
let localElapsed = 0, localDuration = 1, lastTick = performance.now();

function fmtTime(s) {
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg || "";
  t.classList.toggle("bad", !!bad);
  t.style.display = msg ? "block" : "none";
  clearTimeout(toast.timer);
  if (msg) toast.timer = setTimeout(() => { t.style.display = "none"; }, 3600);
}

async function post(op, extra) {
  try {
    const r = await fetch("/api/command", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(Object.assign({op}, extra || {}))
    });
    if (!r.ok) { toast("command failed: " + ((await r.json()).error || r.status), true); return; }
    refresh();                    // the command lands at the top of the next frame
  } catch (e) { toast("offline", true); }
}

/* ---- optimistic intent ------------------------------------------------- *
 * post() refreshes as soon as the command is away, but the scheduler drains
 * its queue at the top of its next frame, so that reply still describes the
 * world before the tap. Painting it back takes the switch out from under the
 * finger and puts it back a second later, which reads as the panel refusing
 * you. The activeElement guard below only covers the case where the control
 * takes focus when tapped -- which a switch wrapped in a label does not do on
 * iOS, and the mode buttons never did anywhere.
 *
 * So the intent is held instead, and let go of when the state agrees with it
 * -- or after a few seconds if it never does, because a command the scheduler
 * refused should not stay lit for the rest of the evening.
 */
const ACK_MS = 4000;
let wantGroup = null;             // {key, since}
const wantEnabled = new Map();    // name -> {on, since}

function settleGroup(s) {
  if (wantGroup && (s.group === wantGroup.key ||
                    performance.now() - wantGroup.since > ACK_MS))
    wantGroup = null;
  return wantGroup ? wantGroup.key : s.group;
}

function settleEnabled(e) {
  const w = wantEnabled.get(e.name);
  if (!w) return e.enabled;
  if (w.on === e.enabled || performance.now() - w.since > ACK_MS) {
    wantEnabled.delete(e.name);
    return e.enabled;
  }
  return w.on;
}

function wantToggle(name, on) {
  wantEnabled.set(name, {on, since: performance.now()});
  post("toggle", {name, on});
}

/* ---- acknowledgement --------------------------------------------------- *
 * The loudest complaint about the old panel was that tapping something
 * appeared to do nothing: the command is queued and applied at the top of the
 * next render frame, this page only learns the outcome on its next 1 Hz poll,
 * and a segment that has not been rendered yet has to be built first --
 * usually fast, occasionally fourteen seconds.
 *
 * So a tap marks its row immediately and the row then says what is actually
 * true, in this order: `requested` (we sent it, nothing more), `queued next`
 * (the scheduler has it as next and it is ready), `building` (it is next and
 * next.ready is false -- the scheduler's word, not a spinner) and `on air`.
 * Nothing here claims the wall is doing something it is not.
 */
const pending = new Map();        // name -> when it was tapped

function markPending(name) {
  pending.set(name, performance.now());
  if (state) paint(state);        // no wait for the next poll to acknowledge
}

function statusOf(name) {
  if (!state) return null;
  const since = pending.get(name);
  const live = state.now && state.now.name === name;
  if (live) {
    // Seen it land: keep the badge on for a moment and then let it go.
    if (since !== undefined && performance.now() - since > 2500) pending.delete(name);
    return since === undefined ? null : {cls: "onair", text: "on air"};
  }
  if (since === undefined) return null;
  if (performance.now() - since > 30000) { pending.delete(name); return null; }
  if (state.next && state.next.name === name)
    return state.next.ready ? {cls: "queued", text: "queued next"}
                            : {cls: "building", text: "building"};
  return {cls: "requested", text: "requested"};
}

/* ---- building the two views -------------------------------------------- */

function thumbFor(name, onClick) {
  const b = document.createElement("button");
  b.className = "thumb";
  b.type = "button";
  b.title = "Play " + name + " now";
  b.setAttribute("aria-label", "Play " + name + " now");
  const img = document.createElement("img");
  img.loading = "lazy";           // 74 clips, 3.4 MB, mostly in shut sections
  img.alt = "";
  img.src = "/previews/" + encodeURIComponent(name) + ".webp";
  const missing = document.createElement("span");
  missing.className = "missing";
  missing.textContent = "no prev";
  missing.hidden = true;
  // 12 of the 86 have no preview at all. That tile is a state, not a bug.
  img.addEventListener("error", () => { img.hidden = true; missing.hidden = false; });
  b.append(img, missing);
  b.addEventListener("click", onClick);
  return {el: b, img, missing};
}

/* Jumping to something switched off would put it on the wall and then never
   come back to it, which reads as a bug. Turn it on as well. */
function jumpTo(e) {
  markPending(e.name);
  if (!e.enabled) wantToggle(e.name, true);
  post("jump", {index: positionOf(e.name)});
}

function positionOf(name) {
  const e = state && state.rotation.find(x => x.name === name);
  return e ? e.position : 0;
}

function makeRow(e, withNumber) {
  const row = document.createElement("div");
  row.className = "row";

  let num = null;
  if (withNumber) {
    num = document.createElement("span");
    num.className = "num";
    row.append(num);
  }

  const t = thumbFor(e.name, () => jumpTo(entryFor(e.name) || e));
  row.append(t.el);

  const who = document.createElement("div");
  who.className = "who";
  const nameLine = document.createElement("div");
  nameLine.className = "name";
  const nameText = document.createElement("span");
  nameText.textContent = e.name;
  const chips = document.createElement("span");
  nameLine.append(nameText, chips);
  const meta = document.createElement("div");
  meta.className = "meta";
  who.append(nameLine, meta);
  row.append(who);

  let slot = null, cost = null;
  if (withNumber) {               // the Order view puts the numbers in columns
    slot = document.createElement("span");
    slot.className = "slot";
    cost = document.createElement("span");
    cost.className = "cost";
    row.append(slot, cost);
  }

  let cog = null, box = null;
  if (!withNumber) {
    // Only where there is something to edit: an exec entry is somebody else's
    // program, and a demo that declares no options has no form to show.
    if (e.kind !== "exec" && (schema[e.module] || []).length) {
      cog = document.createElement("button");
      cog.type = "button";
      cog.className = "cog";
      cog.textContent = "⚙";
      cog.title = "Settings for " + e.name;
      cog.setAttribute("aria-label", "Settings for " + e.name);
      cog.addEventListener("click", () => openEditor(e.name));
      row.append(cog);
    }
    const sw = document.createElement("label");
    sw.className = "sw";
    box = document.createElement("input");
    box.type = "checkbox";
    box.checked = e.enabled;
    box.setAttribute("aria-label", "Play " + e.name + " in the rotation");
    box.addEventListener("change", () => wantToggle(e.name, box.checked));
    sw.append(box, document.createElement("span"));
    row.append(sw);
  }

  return {row, img: t.img, missing: t.missing, box, meta, cog, chips, num, slot, cost};
}

function entryFor(name) {
  return state && state.rotation.find(x => x.name === name);
}

function buildIndex(rotation) {
  sections.textContent = "";
  rows.clear();
  const placed = new Set();
  const byName = new Map(rotation.map(e => [e.name, e]));

  const buckets = groups.filter(g => g.key !== "all" && (g.members || []).length)
                        .map(g => ({key: g.key, label: g.label, desc: g.description,
                                    members: g.members.filter(n => byName.has(n))}));
  for (const b of buckets) for (const n of b.members) placed.add(n);
  // Overlapping membership is fine and intended -- tide is honestly both a
  // data panel and a San Francisco one -- but something in no group at all
  // would otherwise be unreachable from this view.
  const loose = rotation.filter(e => !placed.has(e.name));
  if (loose.length)
    buckets.push({key: null, label: "Ungrouped", desc: "In no themed set",
                  members: loose.map(e => e.name)});

  for (const b of buckets) {
    const sec = document.createElement("div");
    sec.className = "sec";

    const head = document.createElement("button");
    head.className = "head";
    head.type = "button";
    const caret = document.createElement("span");
    caret.className = "caret";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = b.label;
    const desc = document.createElement("span");
    desc.className = "desc";
    desc.textContent = b.desc || "";
    const tally = document.createElement("span");
    tally.className = "tally";
    head.append(caret, label, desc, tally);

    const body = document.createElement("div");
    body.className = "body";
    body.hidden = true;
    head.setAttribute("aria-expanded", "false");
    head.addEventListener("click", () => {
      open[b.key] = !open[b.key];
      applyOpen();
    });

    let setmode = null;
    if (b.key) {
      // One tap, no confirmation, unlike the switches at the bottom of the
      // page: it is the point of the row and the way back is Enable all.
      setmode = document.createElement("button");
      setmode.type = "button";
      setmode.className = "setmode";
      setmode.setAttribute("role", "radio");
      setmode.setAttribute("aria-checked", "false");
      setmode.textContent = "Set as mode";
      setmode.addEventListener("click", (ev) => {
        ev.stopPropagation();
        wantGroup = {key: b.key, since: performance.now()};
        post("select", {group: b.key});
      });
      head.append(setmode);
    }

    for (const n of b.members) {
      const e = byName.get(n);
      if (!e) continue;
      const r = makeRow(e, false);
      body.append(r.row);
      // A name in two groups gets two rows; both are painted, and the map
      // holds a list rather than pretending there is only one.
      if (!rows.has(n)) rows.set(n, []);
      rows.get(n).push(r);
    }

    sec.append(head, body);
    sec._parts = {caret, body, head, tally, setmode, key: b.key,
                  members: b.members};
    sections.append(sec);
  }
  applyOpen();
}

function buildOrder(rotation) {
  orderBox.textContent = "";
  orderRows.clear();
  for (const e of rotation) {
    const r = makeRow(e, true);
    orderBox.append(r.row);
    orderRows.set(e.name, r);
  }
}

/* A shut section hides its rows; a search opens whatever it matches, so a
   query is never answered by a page of closed headings. */
function applyOpen() {
  for (const sec of sections.children) {
    const p = sec._parts;
    const hits = query ? p.members.filter(n => n.includes(query)).length : null;
    const expanded = query ? hits > 0 : !!open[p.key];
    p.body.hidden = !expanded;
    p.caret.textContent = expanded ? "▾" : "▸";
    p.head.setAttribute("aria-expanded", String(expanded));
    sec.hidden = query ? hits === 0 : false;
  }
}

function paintRow(r, e, s) {
  const live = e.name === s.now.name;
  const st = statusOf(e.name);
  const on = settleEnabled(e);
  r.row.classList.toggle("live", live);
  r.row.classList.toggle("pending", !live && !!st);
  r.row.classList.toggle("disabled", !on);
  if (r.box && document.activeElement !== r.box) r.box.checked = on;

  r.chips.textContent = "";
  if (st) {
    const c = document.createElement("span");
    c.className = "chip st " + st.cls;
    c.textContent = st.text;
    r.chips.append(c);
  }
  if (e.customised) r.chips.append(chip("cust", "custom"));
  if (e.solo && e.kind !== "exec") r.chips.append(chip("solo", "solo"));

  const ms = e.ms ? e.ms.toFixed(1) : null;
  const heat = e.ms > 33 ? "hot" : e.ms > 18 ? "warm" : "";
  if (r.num) {                              // Order view: numbers in columns
    r.num.textContent = e.enabled ? (e.position + 1) : "—";
    r.slot.textContent = [fmtTime(e.seconds), e.kind === "exec" ? "external"
                          : (e.fps ? e.fps + " fps" : "")].filter(Boolean).join(" · ");
    r.cost.textContent = ms ? ms + " ms" : "";
    r.cost.className = "cost " + heat;
    r.meta.textContent = live ? "on air" : (e.enabled ? "" : "not in the rotation");
  } else {
    r.meta.textContent = "";
    r.meta.append(live ? "on air" : (e.enabled ? "#" + (e.position + 1) : "off"));
    // The slot length is the same 40 seconds for nearly everything, so it is
    // the first thing to go when the row is narrower than the line: position,
    // rate and cost are what somebody is actually reading down the column for.
    const len = document.createElement("span");
    len.className = "len";
    len.textContent = " · " + fmtTime(e.seconds);
    r.meta.append(len);
    const rate = e.kind === "exec" ? "external" : (e.fps ? e.fps + " fps" : "");
    if (rate) r.meta.append(" · " + rate);
    if (ms) {
      r.meta.append(" · ");
      const el = document.createElement("span");
      el.className = "ms " + heat;
      el.textContent = ms + " ms";
      r.meta.append(el);
    }
  }
  if (r.cog) r.cog.classList.toggle("custom", !!e.customised);
}

// The cue zone. Rebuilt from the snapshot each second rather than diffed:
// there are one or two of these, not sixty, and a chip that is rebuilt cannot
// hold a stale time.
function paintCues(cues) {
  $("cuesZone").hidden = cues.length === 0;
  const box = $("cues");
  box.textContent = "";
  for (const c of cues) {
    const el = document.createElement("div");
    el.className = "cue";
    el.dataset.playing = String(!!c.playing);
    const name = document.createElement("b");
    name.textContent = c.name;
    const at = document.createElement("span");
    at.className = "at";
    // Struck through once it has been today, so somebody looking at the page
    // at ten in the morning can see the 9:25 has been and gone.
    c.at.forEach((t, i) => {
      if (i) at.append(document.createTextNode(" \u00b7 "));
      const one = document.createElement("span");
      one.textContent = t;
      if ((c.fired_today || []).includes(t)) one.className = "done";
      at.append(one);
    });
    const go = document.createElement("button");
    go.type = "button";
    go.textContent = c.playing ? "on air" : "Play now";
    go.disabled = !!c.playing;
    go.addEventListener("click", () => post("cue", { name: c.name }));
    el.append(name, at, go);
    box.append(el);
  }
}

function paint(s) {
  // Rebuild only when the rotation itself changed, not once a second.
  const names = s.rotation.map(e => e.name).join(" ");
  if (names !== paint.names) {
    buildIndex(s.rotation);
    buildOrder(s.rotation);
    paint.names = names;
  }

  for (const e of s.rotation) {
    for (const r of (rows.get(e.name) || [])) paintRow(r, e, s);
    const o = orderRows.get(e.name);
    if (o) paintRow(o, e, s);
  }

  // Section tallies and which one is the live mode. The scheduler answers
  // that -- it is `group` in the state, and null once somebody has flipped an
  // individual switch and the set matches no mode exactly.
  const group = settleGroup(s);
  for (const sec of sections.children) {
    const p = sec._parts;
    const on = p.members.filter(n => { const e = entryFor(n); return e && e.enabled; }).length;
    p.tally.textContent = on + "/" + p.members.length + " on";
    p.tally.className = "tally " + (on === p.members.length ? "full" : on ? "part" : "");
    if (p.setmode) {
      const active = group === p.key;
      p.setmode.setAttribute("aria-checked", String(active));
      p.setmode.textContent = active ? "Playing" : "Set as mode";
    }
  }

  const enabled = s.rotation.filter(e => e.enabled).length;
  $("count").textContent = s.rotation.length + " effects · " + enabled + " on"
    + (group == null ? " · custom mix"
       : group === "all" ? "" : " · " + group);

  paintCues(s.cues || []);
  $("nowName").textContent = s.now.name || "—";
  $("nowPos").textContent = s.now.position >= 0 ? (s.now.position + 1) + "/" + enabled : "";
  $("nextName").textContent = s.next.name || "—";
  $("nextBuilding").hidden = !(s.next.name && !s.next.ready);
  // Only when there is no live stream in this tile. Repointing src at a preview
  // on every transition would tear the stream down and build it again several
  // times a minute, which is both worse to look at and a slot released and
  // re-taken each time.
  if (!live && s.now.name && $("nowImg").dataset.name !== s.now.name) {
    $("nowImg").dataset.name = s.now.name;
    $("nowImg").hidden = false;
    $("nowMissing").hidden = true;
    $("nowImg").src = "/previews/" + encodeURIComponent(s.now.name) + ".webp";
  }

  const btn = $("btnPause");
  btn.setAttribute("aria-pressed", String(s.paused));
  btn.textContent = s.paused ? "Paused" : "Pause";

  const h = s.health;
  const el = $("health");
  el.textContent = h.actual_fps.toFixed(1) + "/" + h.target_fps + " fps · "
    + h.ms_per_frame.toFixed(1) + " ms · " + fmtTime(h.uptime) + " up"
    + (h.late_frames ? " · " + h.late_frames + " late" : "");
  // Only shout when we are actually missing the frame rate, not for the odd
  // late frame during a transition, which is normal and expected.
  el.classList.toggle("warn", h.actual_fps < h.target_fps * 0.9);

  applyFilter();

  localElapsed = s.now.elapsed;
  localDuration = Math.max(1, s.now.duration);
  lastTick = performance.now();
}

$("nowImg").addEventListener("error", () => {
  $("nowImg").hidden = true;
  $("nowMissing").hidden = false;
});

/* ---- search and the view switch ---------------------------------------- */

function applyFilter() {
  let shown = 0;
  for (const [name, list] of rows)
    for (const r of list) {
      const hit = !query || name.includes(query);
      r.row.hidden = !hit;
      if (hit) shown++;
    }
  for (const [name, r] of orderRows) {
    const hit = !query || name.includes(query);
    r.row.hidden = !hit;
  }
  applyOpen();
  const any = !query || (view === "index" ? shown > 0
                         : [...orderRows.keys()].some(n => n.includes(query)));
  $("empty").hidden = any;
}

$("search").addEventListener("input", () => {
  query = $("search").value.trim().toLowerCase();
  applyFilter();
});

function setView(v) {
  view = v;
  sections.hidden = v !== "index";
  orderBox.hidden = v !== "order";
  $("viewIndex").setAttribute("aria-pressed", String(v === "index"));
  $("viewOrder").setAttribute("aria-pressed", String(v === "order"));
  applyFilter();
}
$("viewIndex").addEventListener("click", () => setView("index"));
$("viewOrder").addEventListener("click", () => setView("order"));
setView("index");

/* ---- the settings editor ----------------------------------------------- *
 * The form is generated from the schema the server read off each demo's own
 * argparse, so there is nothing here that knows what a firefly is. Adding an
 * option to a demo puts a control in this dialog and nothing has to be
 * touched on this side -- which is the only version of this that stays true a
 * year from now.
 */

const dlg = $("editor");
const edBody = $("edBody");
let editing = null;               // name of the entry the dialog is showing
let fields = [];                  // [{o, el}] for the form currently in it

async function loadSchema() {
  try {
    const r = await fetch("/api/schema", {cache: "no-store"});
    const j = await r.json();
    schema = j.modules || {};
    // The groups ride on the same fetch: fixed for the life of the daemon, so
    // polling them would be a second of radio for an answer that never
    // changes. Which one is active does change, and is in the state.
    groups = j.groups || [];
    // The data section is the one somebody opening this page is most often
    // after, and a page of shut headings is a worse first screen than one
    // open one.
    if (groups.some(g => g.key === "data")) open.data = true;
    paint.names = null;           // rebuild: the rows were made without groups
    refresh();
  } catch (e) { /* no editors, no grouping; everything else still works */ }
}

/* Effective settings: what the entry overrides, over the demo's defaults. */
function settingsOf(e) {
  const out = {};
  for (const o of schema[e.module] || [])
    out[o.name] = (e.options && o.name in e.options) ? e.options[o.name] : o.default;
  return out;
}

function chip(cls, text) {
  const el = document.createElement("span");
  el.className = "chip " + cls;
  el.textContent = text;
  return el;
}

function makeField(o, value) {
  const box = document.createElement("div");
  box.className = "fld";
  const top = document.createElement("div");
  top.className = "top";

  const lbl = document.createElement("label");
  lbl.className = "lbl";
  lbl.textContent = o.label;
  // The person retyping the splitflap board from a phone is often the person
  // who has run it from a terminal, so show what it is called there -- but
  // only the flags the label does not already say.
  const extra = o.flags.filter(f => f.replace(/^-+/, "") !== o.label);
  if (extra.length) {
    const flags = document.createElement("em");
    flags.textContent = "  " + extra.join(" ");
    lbl.append(flags);
  }

  let el, wide = false;
  if (o.choices) {
    el = document.createElement("select");
    for (const c of o.choices) {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      el.append(opt);
    }
    el.value = String(value);
  } else if (o.type === "bool") {
    el = document.createElement("input");
    el.type = "checkbox";
  } else if (o.type === "int" || o.type === "float") {
    el = document.createElement("input");
    el.type = "number";
    el.step = o.type === "int" ? "1" : "any";
    // Gets a phone the right keypad; type=number alone gets a full keyboard
    // on some of them.
    el.inputMode = o.type === "int" ? "numeric" : "decimal";
    el.value = String(value);
  } else {
    wide = String(o.default).length > 40 || String(value).length > 40;
    el = document.createElement(wide ? "textarea" : "input");
    if (!wide) el.type = "text";
    el.value = value == null ? "" : String(value);
  }
  if (o.type === "bool") el.checked = !!value;
  el.id = "ed-" + o.name;
  lbl.htmlFor = el.id;

  let ctl;
  if (o.type === "bool") {
    // The same switch as on the rows, so on/off looks like one thing.
    ctl = document.createElement("label");
    ctl.className = "ctl sw";
    ctl.append(el, document.createElement("span"));
  } else {
    ctl = document.createElement("div");
    ctl.className = "ctl";
    ctl.append(el);
  }

  top.append(lbl);
  box.append(top);
  // A message board or a script gets its own full-width line; everything else
  // sits at the end of the label row.
  if (wide) { box.classList.add("wide"); box.append(ctl); }
  else top.append(ctl);
  if (o.help) {
    const help = document.createElement("div");
    help.className = "hlp";
    help.textContent = o.help;
    box.append(help);
  }
  fields.push({o, el});
  return box;
}

function openEditor(name) {
  const e = entryFor(name);
  if (!e) return;
  const spec = schema[e.module] || [];

  editing = name;
  fields = [];
  $("edName").textContent = e.name;
  $("edModule").textContent = e.module === e.name ? "" : e.module + ".py";
  edBody.textContent = "";
  if (!spec.length) {
    const none = document.createElement("div");
    none.className = "ed-empty";
    none.textContent = "This effect declares no options.";
    edBody.append(none);
  } else {
    const current = settingsOf(e);
    for (const o of spec) edBody.append(makeField(o, current[o.name]));
  }

  const note = document.createElement("div");
  note.className = "ed-note";
  // Both halves matter: the wall will not change under you the moment you
  // press Save unless this is the effect on air, and the ms figure on the row
  // was measured against the settings the rotation shipped with.
  note.textContent = state.now.name === name
    ? "Saving plays " + name + " again from the top with the new settings."
    : "Applies the next time " + name + " comes round. The render cost on the"
      + " row was measured with the settings it shipped with.";
  edBody.append(note);

  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  edBody.scrollTop = 0;
}

function closeEditor() {
  if (dlg.close && dlg.open) dlg.close(); else dlg.removeAttribute("open");
  editing = null;
  fields = [];
}

/* Read the form back. Only what differs from the demo's own default is sent,
   so an entry nobody has really changed does not end up carrying a frozen copy
   of every setting that a later edit to the demo could not reach. */
function collect() {
  const out = {};
  for (const {o, el} of fields) {
    let v;
    if (o.type === "bool") {
      v = el.checked;
    } else if (o.type === "int" || o.type === "float") {
      v = Number(el.value);
      if (el.value.trim() === "" || !isFinite(v)) {
        el.focus();
        throw new Error(o.label + " needs a number");
      }
      if (o.type === "int") v = Math.round(v);
    } else {
      v = el.value;
    }
    if (v !== o.default) out[o.name] = v;
  }
  return out;
}

/* `restart` only when this is what is on the wall: editing the number of
   fireflies while looking at fireflies has to show, or the control reads as
   broken for the rest of a 45 second slot. */
function applyEditor(options) {
  const name = editing;
  const live = !!(state && state.now.name === name);
  closeEditor();
  post("configure", {name, options, restart: live});
}

$("edSave").addEventListener("click", () => {
  let options;
  try { options = collect(); }
  catch (err) { toast(err.message, true); return; }
  applyEditor(options);
});
$("edReset").addEventListener("click", () => {
  // Confirmed only when there is something to lose. It sits a thumb's width
  // from Save on a phone, and somebody may have spent a while on these.
  const e = entryFor(editing);
  if (e && e.customised
      && !confirm("Put " + editing + " back to the settings it shipped with?"))
    return;
  // null, not {}: back to what the rotation file says, which is what the wall
  // was installed with -- not the demo's bare argparse defaults, which nobody
  // chose.
  applyEditor(null);
});
$("edCancel").addEventListener("click", closeEditor);
$("edClose").addEventListener("click", closeEditor);
dlg.addEventListener("cancel", closeEditor);            // Esc
// A click that lands on the dialog element itself is a click on the backdrop:
// everything inside is a child.
dlg.addEventListener("click", (ev) => { if (ev.target === dlg) closeEditor(); });

function tick() {
  const now = performance.now();
  if (state && !state.paused) localElapsed += (now - lastTick) / 1000;
  lastTick = now;
  document.querySelector("#progress i").style.width =
    (100 * Math.min(1, localElapsed / localDuration)) + "%";
  requestAnimationFrame(tick);
}

async function refresh() {
  let s;
  // Only the fetch is guarded. A failure to draw is a bug in this file and
  // should be reported as one, not swallowed and shown as "the scheduler is
  // not answering" -- which is how it would then be diagnosed.
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    s = await r.json();
  } catch (e) {
    toast("cannot reach the scheduler", true);
    return;
  }
  if (!s || !s.rotation) return;            // still starting up
  state = s;
  paint(s);
}

$("btnNext").addEventListener("click", () => post("next"));
$("btnPause").addEventListener("click", () => post(state && state.paused ? "resume" : "pause"));
$("btnAllOn").addEventListener("click", () => post("all", {on: true}));
$("btnAllOff").addEventListener("click", () => {
  // Irreversible-ish from a phone -- putting 85 switches back one at a time is
  // nobody's afternoon.
  if (confirm("Switch every effect off except the one on air?"))
    post("all", {on: false});
});

/* ---- the display itself ------------------------------------------------ */
/* Not the scheduler: brightness and blanking belong to ft_server, which owns
   the panel, and these go to ftctl over /api/display. Which is also why they
   keep working when the rotation does not -- and why the row simply is not
   there when nothing answers that path, rather than showing dead controls. */

const displayZone = $("displayZone");
const btnPower = $("btnPower");
const dimSlider = $("dim");
let display = null;
let dimming = false;              // a finger is on the slider; do not fight it

async function postDisplay(body) {
  try {
    const r = await fetch("/api/display", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    const s = await r.json();
    if (!r.ok) { toast("display: " + (s.error || r.status), true); return; }
    paintDisplay(s.display);
  } catch (e) { toast("cannot reach the display", true); }
}

function paintDisplay(d) {
  display = d;
  if (!d) {                       // ftctl is up but ft_server is not
    displayZone.hidden = false;
    btnPower.disabled = true;
    btnPower.textContent = "display offline";
    displayZone.classList.add("nodimmer");
    return;
  }
  displayZone.hidden = false;
  btnPower.disabled = false;
  btnPower.textContent = d.blanked ? "Wall on" : "Wall off";
  btnPower.setAttribute("aria-pressed", d.blanked ? "true" : "false");
  displayZone.classList.toggle("nodimmer", !d.dimmer);
  if (!dimming) {
    dimSlider.value = d.brightness;
    $("dimOut").textContent = d.brightness + "%";
  }
}

async function refreshDisplay() {
  try {
    const r = await fetch("/api/display", {cache: "no-store"});
    if (!r.ok) { displayZone.hidden = true; return; }   // not routed here
    paintDisplay((await r.json()).display);
  } catch (e) {
    displayZone.hidden = true;    // served standalone, or ftctl is not running
  }
}

btnPower.addEventListener("click", () => {
  // The remote makes this a held thumb; here it is a question. Either way it
  // is not something that happens on a stray tap in front of a room.
  const off = !(display && display.blanked);
  if (off && !confirm("Turn the wall off?")) return;
  postDisplay({blanked: off});
});
$("btnWipe").addEventListener("click", () => {
  // Clears every layer, background included, so it takes out whatever any
  // other client had put up -- worth one question.
  if (confirm("Clear the whole display, including other clients' layers?"))
    postDisplay({wipe: true});
});

// Track the value while dragging but only send on release. Each change forces
// ft_server to re-encode the whole frame under the writer lock, which is fine
// once and not fine sixty times a second.
dimSlider.addEventListener("input", () => {
  dimming = true;
  $("dimOut").textContent = dimSlider.value + "%";
});
for (const ev of ["change", "pointerup", "keyup"])
  dimSlider.addEventListener(ev, () => {
    if (!dimming) return;
    dimming = false;
    postDisplay({brightness: Number(dimSlider.value)});
  });

// The live wall, in the tile that until now held a baked clip of it.
//
// One <img> at a multipart endpoint, which is the entire client: the stream is
// a sequence of PNGs and the browser swaps them in as they land. There are only
// two viewer slots on the Pi, so this hands one back the moment the tab is
// hidden -- a console left open on a second monitor is exactly the thing that
// would otherwise hold a slot all afternoon.
//
// A 503 means somebody else has the slots and is an ordinary outcome, not an
// error to shout about: the tile quietly goes back to being what it was before,
// a baked preview of whatever is playing.
let live = false;
function liveOn() {
  if (live) return;
  live = true;
  const img = $("nowImg");
  img.onerror = () => {
    // No stream to be had. Drop back to the preview and let the state poll
    // repaint it by clearing the name it thinks it is showing.
    live = false;
    img.onerror = null;
    img.dataset.name = "";
  };
  img.hidden = false;
  $("nowMissing").hidden = true;
  img.src = "/api/live.png";
}
function liveOff() {
  if (!live) return;
  live = false;
  const img = $("nowImg");
  img.onerror = null;
  // Clearing src is what actually closes the connection and frees the slot.
  img.removeAttribute("src");
  img.dataset.name = "";
}

// One poll a second while visible. A backgrounded tab on a phone should not
// keep the radio awake for a page nobody is looking at.
let timer = null;
function poll(on) {
  clearInterval(timer);
  timer = on ? setInterval(() => { refresh(); refreshDisplay(); }, 1000) : null;
  if (on) { refresh(); refreshDisplay(); }
  if (on) liveOn(); else liveOff();
}
document.addEventListener("visibilitychange", () => poll(!document.hidden));
poll(true);
loadSchema();
requestAnimationFrame(tick);
</script>
</body>
</html>
